# Configuracao padrao do Sistema de Gestao de Biblioteca (Trabalho 3 - PUCPR)
# Qualquer parametro abaixo pode ser sobrescrito na linha de comando com -D<chave>=<valor>.

# Perfil de execucao (R08 - Abstract Factory): MEMORIA | PRODUCAO
biblioteca.perfil=MEMORIA

# Politica inicial de calculo de multa (R02 - Strategy): ORIGINAL | COM_TETO_20 | COM_TOLERANCIA_2_DIAS
biblioteca.multa.politica=ORIGINAL

# Banco de cobranca ativo (R03 - Adapter): BANCO_A | BANCO_B
biblioteca.banco=BANCO_A

# Prazos de circulacao (em dias corridos)
biblioteca.prazo.reserva.dias=3
biblioteca.prazo.emprestimo.dias=14
biblioteca.prazo.renovacao.dias=30

# Decoradores opcionais da consulta publica ao acervo (R09 - Decorator)
biblioteca.consulta.cache=true
biblioteca.consulta.medicao=true

# Conexao JDBC do perfil PRODUCAO (MySQL principal; Oracle permanece apenas como replica externa)
biblioteca.jdbc.url=jdbc:mysql://localhost:3306/biblioteca?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
biblioteca.jdbc.usuario=biblioteca
biblioteca.jdbc.senha=biblioteca
